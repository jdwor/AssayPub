    - {name: Timothy Gowers, url: "https://gowers.wordpress.com/feed/", kind: rss, filter: relevant}
    - {name: Xena (Kevin Buzzard), url: "https://xenaproject.wordpress.com/feed/", kind: rss, filter: relevant}
    - {name: AI Policy Perspectives, url: "https://www.aipolicyperspectives.com/feed", kind: rss, filter: relevant}
    - {name: Ruxandra Teslo, url: "https://www.writingruxandrabio.com/feed", kind: rss, filter: relevant}
    - {name: Scott Aaronson, url: "https://scottaaronson.blog/?feed=rss2", kind: rss, filter: relevant}
    - {name: Noahpinion, url: "https://www.noahpinion.blog/feed", kind: rss, filter: relevant}
    - {name: Ran Blekhman, url: "https://blekhman.substack.com/feed", kind: rss, filter: relevant}
    - {name: Science news, url: "https://www.science.org/rss/news_current.xml", kind: rss, filter: relevant}
  funders:
