    - {name: Astera Institute, url: "https://astera.org/feed/", kind: rss, filter: relevant, type: initiative}
    - {name: Schmidt Sciences, url: "https://www.schmidtsciences.org/feed/", kind: rss, filter: relevant, type: initiative}
    - {name: Simons Foundation, url: "https://www.simonsfoundation.org/feed/", kind: rss, filter: relevant, type: rfp}
    - {name: US Department of Energy, url: "https://www.energy.gov/rss.xml", kind: rss, filter: relevant, type: initiative}

# Sources with no feed or API. The weekly editorial run covers these by web search.
web_search_only:
  - X / Twitter (no open API)
  - FutureHouse, Arc Institute, EvolutionaryScale, Isomorphic Labs, Meta FAIR, Periodic Labs, Lila Sciences
  - ARIA, Renaissance Philanthropy, Sloan Foundation, Wellcome, DOE Office of Science
  - SSRN, OECD, Royal Society, National Academies
  - The White House, OpenAI research PDFs, Clay Mathematics Institute

# ---------------------------------------------------------------- social signals
# Posts are not candidates themselves. The links they carry are, and the
# engagement is attached to any candidate with the same link.
social:
  bluesky:
    queries: ["AI for science", "AI scientist", "AI co-scientist", "self-driving lab", "scientific discovery AI",
              "arxiv AI science", "LLM researchers science", "protein design model", "AI mathematics proof"]
    min_likes: 25
  hackernews:
    queries: ["AI scientist", "scientific discovery", "AI for science", "AlphaFold", "AlphaEvolve", "self-driving lab",
              "theorem proving", "protein design", "materials discovery", "drug discovery AI", "research agent", "arxiv AI science"]
    min_points: 40

# ---------------------------------------------------------------- datasets, models, software
resources:
  huggingface:
    tags: [chemistry, biology, medical, climate, physics, science, materials, "materials-science", astronomy, mathematics]
    min_likes: 10
  github:
    queries: ["AI scientist", "scientific discovery agent", "topic:ai-for-science", "topic:ai4science",
              "self-driving lab", "research agent science", "materials discovery", "topic:scientific-machine-learning",
              "theorem proving LLM", "lab automation LLM"]
    min_stars: 50

# ---------------------------------------------------------------- US federal funding
grants_gov:
  keywords: ["artificial intelligence science", "AI for science", "machine learning scientific discovery",
             "autonomous laboratory", "foundation model science"]

# ---------------------------------------------------------------- relevance filter
# A cheap first pass; the editorial triage does the real judging.
relevance:
  strong:      # unmistakably on-topic phrases, 3 points each (max 9)
    ["AI for science", "AI4Science", "AI scientist", "co-scientist", "scientific discovery", "self-driving lab",
     "autonomous lab", "research agent", "hypothesis generation", "automated research", "AI in science",
     "science of science", "theorem proving", "autoformalization", "protein design", "drug discovery",
     "materials discovery", "virtual cell", "foundation model for", "weather forecasting", "peer review",
     "scientific productivity", "research productivity", "metascience", "scientific research", "scientists use"]
  ai_terms:
    ["artificial intelligence", " AI ", "AI-", "machine learning", "deep learning", "language model", "LLM",
     "foundation model", "neural network", "generative", "agentic", "Claude", "GPT", "Gemini", "AlphaFold",
     "AlphaEvolve", "AlphaProof"]
  science_terms:
    ["science", "scientific", "scientist", "research", "researcher", "discovery", "laboratory", "experiment",
     "biology", "chemistry", "physics", "mathematics", "materials", "genomic", "protein", "clinical", "climate",
     "astronomy", "preprint", "peer review", "hypothesis", "R&D", "innovation"]
  threshold: 3

# ---------------------------------------------------------------- life-sciences screen
# Candidates matching any of these terms go to the life-sciences reading list
# (candidates.bio.jsonl), whichever source or topic they came from.
bio_screen:
  ["protein", "antibod", "genom", "enzyme", "crispr", "pathogen", "virus", "viral", "bacteri", "vaccine",
   "clinical", "patient", "tumor", "tumour", "cancer", "drug", "pharma", "therapeutic", "toxic", "biolog",
   "biomedic", "biochem", "biomolec", "cell line", "single-cell", " rna", "mrna", " dna", "peptide", "ligand",
   "medicin", "disease", "neuro", "microb", "immun"]
