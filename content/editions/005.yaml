  date: '2026-11-12'
  by: Kevin Buzzard
  url: https://xenaproject.wordpress.com/2026/11/12/and-the-proof-is-checked-in-lean/
  text: Buzzard examined the Lean code that accompanies 290 of the manuscripts. For about 38 of them the code does
    not state the paper's main theorem. In the example given, a manuscript that claims Lech's multiplicity conjecture,
    the Lean code proves one of the paper's corollaries.
