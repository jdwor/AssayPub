note: |-
  Both selections from the first half of November measure AI with AI. Anthropic's study of how researchers use Claude relies on language models to label 207,049 sessions and to score which research tasks AI can do ({{how-researchers-use-claude}}). A benchmark of AI peer reviewers plants 357 errors in 30 preprints and uses a panel of language models to decide which of them each reviewer caught ({{auditing-ai-peer-reviewers}}).

  Neither had much ground truth to check its instruments against. Anthropic tested its session classifier on transcripts written by a model, and its appendix says that "When no ground truth is available, validation of any classifier is inherently difficult." The benchmark's authors checked their panel against one person's judgments on a single paper, where the two agreed on 127 of 132.

  <!-- rows C and D -->

  Anthropic finds, as Google's study did in September ({{ai-in-science-early-insights}}), that data analysis is the largest use of AI in research. It also finds that gathering data and generating hypotheses get less use than their share of researchers' time. The reviewer benchmark found that, given the same prompt, three frontier models differed by about 50 percentage points in the errors they detected.
