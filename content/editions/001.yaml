note: |-
  The Jacobian conjecture, open for about a century, is false in three dimensions. The counterexample is a single polynomial map of degree seven, found with Claude Fable and announced on July 19. By the next morning it had been formalized in Lean, and two days after the announcement Terence Tao published an account of why it works ({{a-digestion-of-the-jacobian-conjecture}}).

  The map can be verified by direct calculation. Tao's construction recovers it and leaves one step for which no good geometric reason is yet known. A proof of the cycle double cover conjecture, also released in July, runs to three pages, and a graph theorist posted an independent exposition a week later ({{cycle-double-cover-proof}}). Kevin Buzzard describes checking a counterexample to a question of Grothendieck in Lean in under five minutes ({{human-mathematicians-are-being-outcounterexampled}}). Neither Tao's post nor Buzzard's says how the model was used, and the cycle double cover note gives the subject one sentence.

  Essays published in July argue that experiments and institutions, more than ideas, set the pace of research outside mathematics. Two make the case for science policy and for medicine ({{conjecture-machines}}, {{intelligence-is-not-the-main-bottleneck}}), and a third applies Amdahl's law to a biomedical project, where faster literature review barely shortens work that waits on grants, approvals and animals ({{why-ai-will-not-speed-up-science}}). The month's laboratory studies are consistent with them. At Johns Hopkins, recipes written by a language model made known oxides about as often as chemists' recipes did, and the study's one new compound came from a chemist's recipe reacting with its crucible ({{human-and-llm-collaboration-for-accelerated}}). An agent ran a cryogenic microscope on one device, with researchers supplying the question ({{aims-an-ai-experimentalist-turns-uncertainty}}). At Princeton, agents given the questions behind two unpublished papers dropped their most ambitious hypotheses within ten hours, and the papers' authors rejected both results ({{open-ended-research-shadow-evaluations}}).

  <!-- rows C and D -->

  In the publication record, the long decline of single-author papers stopped after 2022 ({{return-of-the-solo-author-the}}). An audit flagged fabricated-looking references in accepted papers at four conferences, and its authors found that most of the flags they checked by hand were false alarms ({{phantom-references-hallucinated-citations-that-s}}).

  The United States government put more than $5 billion behind AI for science ({{genesis-mission-expansion}}). The White House release gives no breakdown of the sum, and the policy report published the day before ({{science-a-new-golden-age}}) does not mention the budget cuts proposed for the same agencies, as Eos reported.
