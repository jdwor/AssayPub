note_bio: |
  Protein engineering supplies the qualification. Computation rewrote the stable cores of three botulinum proteases, and the redesigned enzymes evolved further than the natural ones in every campaign; but establishing that stability was responsible took 44 continuous evolutions and reciprocal grafts of every evolved genotype ({{ai-redesigned-protease-evolution}}). Without that apparatus designs stayed predictions: half a peptide-interface benchmark recovered ({{vilya-2-molecular-interfaces}}), 306,146 binders released unmade ({{the-human-bindome-a-proteome-scale}}). A chemistry campaign fixed its predictions before synthesis and tripled acetate selectivity, inside a reaction network the chemists supplied ({{cothinker-catalyst-selectivity}}).
