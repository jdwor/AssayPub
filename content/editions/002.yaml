note_bio: |
  Antibody design bears it out: the learned part did best where it stayed inside the older one. Designs that won on affinity reused a heavy-chain CDR3 from the data supplied and changed a few residues elsewhere, and developability followed the cluster a design came from ({{aintibody-blinded-benchmark}}). Outside tests can disagree with each other: two contract laboratories in different assay formats split on 136 of the 1,235 designs both scored ({{claude-protein-binder-design}}). Arc withheld new Perturb-seq data to build the equivalent standard for perturbation prediction ({{virtual-cell-challenge-2026}}), while Phase II, where clinical worth would show, is the stage least touched ({{lowe-ai-drug-discovery-really}}).
