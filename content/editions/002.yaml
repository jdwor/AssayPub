note: |-
  The strongest work in August was tested against something outside the paper. Google DeepMind's cyclone model was scored against two seasons of recorded storms ({{operational-cyclone-forecasting}}), Germany's weather service verified its operational machine-learning model against a year of observations ({{aicon-an-operational-global-machine-learning}}), and Anthropic's proof about the zeros of the zeta function was re-proved by an outside number theorist within a month ({{more-than-two-thirds-of-the}}).

  In the physical sciences the learned component works inside an older system. Both weather models start every forecast from a physics-based analysis, and the German one is trained on its service's own reanalysis. Each is weaker than the conventional system on some measure: cyclone intensity at long lead times in one case, surface pressure in the other. At Linköping a classifier sorted database entries to find overlooked layered compounds, and the group then made 11 new members of the family by combustion synthesis ({{mxenes-data-driven-discovery}}). The shortlist has more of the kind: anomaly detection in the CMS trigger ({{unsupervised-anomaly-detection-for-real-time}}) and learned control on two tokamaks ({{reinforcement-learning-for-vertical-position-con}}, {{real-time-virtual-circuits-for-plasma}}).

  <!-- rows C and D -->

  Mathematics arrived as company announcements. OpenAI published ten results with Lean files and no account of how they were obtained, and reissued the paper within a week after mathematicians objected to how earlier work was credited ({{ten-advances-in-mathematics-and-theoretical}}). Anthropic published transcripts of the work on its zeta result, named the prior work the result draws on, and had outside experts read the paper. Timothy Gowers attributes the results so far to broad knowledge and wide search ({{gowers-what-maths-are-llms-good-at}}). Terence Tao argues that if proofs become plentiful, verifying them, explaining them and absorbing them into a field will limit progress ({{mathematics-in-the-age-of-ai}}), and Daniel Litt describes incentives under which the abundance would be wasted ({{the-end-of-mathematics}}).

  Studies of AI in research practice relied on indirect measures. A model trained to replicate published figures outscored larger agents by the judge it was trained against ({{training-ai-scientists-to-replicate-research}}). An estimate that 89% of biomedical papers show signs of language-model assistance counts any use, editing included ({{most-biomedical-publications-show-signs-of}}). Economics papers that disclose AI use credit more research assistants, among the authors who choose to disclose ({{ai-and-the-research-assistant}}).
