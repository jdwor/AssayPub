note: |-
  Anthropic released a machine-written formal proof of Fermat's Last Theorem that an outside expert compiled and confirmed ({{formalizing-fermats-last-theorem}}). Four days later OpenAI claimed a blowup result for the Navier–Stokes equations with a Lean proof of its own, and the disputes that followed were about what such a check covers ({{navier-stokes-blowup}}).

  The Fermat proof establishes a statement already in Lean's library, and Kevin Buzzard, who compiled it, adds that it says nothing new about the mathematics. The Navier–Stokes code compiles too, but a later comparison found two lemmas where it differs from the 166-page paper ({{navier-stokes-lost-in-translation-why}}). In a benchmark published the same month, 68 open Erdős problems were fixed in advance and stated in Lean. One model resolved two within budget and three more at much greater cost, and the proofs are verified and not yet understood ({{frontiermath-erdos}}). Mathematicians responded within weeks, with a declaration signed by Fields medalists ({{a-severe-misalignment-of-ai-in}}) and with guidelines asking companies to disclose models, prompts and costs and to pay for the work of understanding ({{responsible-release-of-ai-generated-mathematics}}).

  Outside mathematics, where no check is complete, sixteen copies of one agent searching a materials database reproduced one another's numbers, and fifteen chose the same defective entry ({{divergent-strategies-convergent-outcomes}}). Agents permitted to game their scoring got past a panel of reviewing models more often when told why they had been caught ({{reward-hacking-research-agents}}). A climate scientist argues that a black-box model can be trusted only where its predictions are checked quickly ({{headlines-and-inside-stories}}). In a Google survey, 46% of scientists who saved time with AI spent more than a quarter of the saving on checking its output ({{ai-in-science-early-insights}}), and one proposal would allocate scarce experiments among agents by market ({{agentic-economies}}).

  <!-- rows C and D -->

  ICML assigned papers at random to a ban on language models in reviewing or to limited use. Acceptance rates were the same, and 22.5% of surveyed reviewers under the ban said they had used one ({{icml-2026-llm-peer-review}}). An analysis of 2,507 published comparisons found AI methods worse than traditional statistics on both accuracy and cost in about a quarter of cases ({{ai-enabled-scientific-frontier}}). The month's laboratory result, a palladium-oxide catalyst, was tested by the company that made it ({{palladium-oxide-catalysts}}).
