note_bio: |
  In biology what outran checking was volume. Nine billion predicted variant effects were released as a petabyte, the accuracy claim one sentence naming no benchmark and the supporting collaborations reported in the company's own announcement ({{alphagenome-atlas}}). What checking exists is cheap and narrow: swapping the compound changed the predictions of an agent-chosen cell model by exactly zero, leaving it 0.0011 above a predictor that never saw the drug ({{cellaudit-input-use-claims}}). The month's enzyme-system announcement failed its own replication in all ten reruns ({{claude-art-enzyme-system}}), and twelve biology problems were written to be cheap to judge ({{millennium-problems-biology}}).
