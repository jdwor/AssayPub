note_bio: |
  In biology the volume was designs, and measurement was the step not taken. The distributed-bottleneck case is preclinical: 35,000 designs produced three IgE binders and twenty that strip it from cells, and the mouse result rests on seven treated animals at P = 0.057 by litter ({{anthropic-drug-development}}). Nine replayed optimization campaigns met their objectives wherever the property models were accurate on the chemistry proposed, and no compound was synthesized ({{magi-industrial-campaigns}}). Cropping targets cut folding time 88%, yet yeast display enriched the arms in a different order ({{epitope-excision-binder-design}}); restoring one matrix multiplication moved BRCA1 scoring from below chance to 0.869 ({{evo2-fp8-checkpoints}}).
