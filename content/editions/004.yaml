note: |-
  OpenAI released about 720 machine-written mathematical manuscripts at once, withdrew three the next day and revised 14 ({{openai-math-release}}). In the same month one algorithm, credited to Claude, refuted two central hypotheses about 3SUM and shortest paths, and within four weeks other groups had simplified and extended it ({{subquadratic-3sum-subcubic-apsp}}).

  The 3SUM result was written up by two complexity theorists who took responsibility for it. In the bulk release, the Lean code for about 38 manuscripts does not state the paper's main theorem. A Prague group that ran its system on 3,800 open problems counts about 200 solved, four of them confirmed by the authors of the source papers ({{bolzano-automated-open-problems}}). arXiv, after a record 40,363 submissions in September, limited each submitter to two papers a month ({{fair-moderation-equitable-access-and-ai}}), and an analysis of its records found submissions outside computer science running 17% above trend since December 2025 ({{arxiv-apocalypse}}).

  Where output could be measured against a standard, most of it was routine. Agents improved on the best published model on all 20 scientific benchmarks in one study, almost entirely by tuning and larger models ({{agents-climb-scientific-hills}}). Hypotheses written by language models lay far from existing papers and still inside directions the literature already covers ({{llms-extend-known-research}}). Shown an agent's plan beside a senior researcher's correction, four of five models preferred the agent's ({{scipivot-pi-judgment}}), and 114 of 135 agent-written papers failed an integrity check in a benchmark led by Carnegie Mellon ({{into-the-unknown}}). A Los Alamos essay argues that when reasoning is cheap, choosing questions, running experiments and validating claims set the pace ({{when-scientific-cognition-is-no-longer-scarce}}).

  <!-- rows C and D -->

  In the physical sciences, developers of learned climate models report where their own emulators failed outside training conditions ({{ai-pathways-weather-to-climate}}), and an agent that explained new optical spectra with first-principles calculations did so for one material, with its prediction untested ({{ai-theorist-rucl3}}).

  Eleven companies pledged $2.4 billion in tools and computing credits to the federal Genesis Mission, on terms the White House did not state ({{golden-age-summit-fact-sheet}}).
